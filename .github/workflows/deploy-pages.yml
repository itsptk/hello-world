# Deploy static build to GitHub Pages (project site: https://itsptk.github.io/<repo>/).
# One-time: Repo → Settings → Pages → Build and deployment → Source: GitHub Actions.
# If the repository name is not the URL segment you want, set ASSET_PATH / BASE_PATH in the Build step.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          # Must match repo name for https://<user>.github.io/<repo>/ (see github.event.repository.name)
          ASSET_PATH: /${{ github.event.repository.name }}/
          BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build:gh-pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
